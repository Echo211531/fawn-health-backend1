server:
  port: 8112
  servlet:
    context-path: /api

spring:
  # DashScope API Key 配置
  ai:
    dashscope:
      api-key: xxx  # 请替换为你的 DashScope API 密钥
      chat:
        options:
          model: qwen-plus
    mcp:
      client:
        stdio:
          servers-configuration: classpath:mcp-servers.json


  redisson:
    host: ${spring.redisson.host}
    port: ${spring.redisson.port}
    password: ${spring.redisson.password}
    database: ${spring.redisson.database}

  rabbitmq:
    host: ${spring.rabbitmq.host}
    port: ${spring.rabbitmq.port}
    username: ${spring.rabbitmq.username}
    password: ${spring.rabbitmq.password}
    # 开启confirm机制
    publisher-confirm-type: correlated
    # 开启return机制
    publisher-returns: true
    #全局配置，局部配置存在就以局部为准
    listener:
      simple:
        acknowledge-mode: manual # 手动ACK

  profiles:
    active: local
  application:
    name: fawn-health
  data:
    redis:
      database: 0
      host: 110.40.137.152
      port: 6379
      password: 151212
      timeout: 5000
    mongodb:
      uri: mongodb://xxx/chat_memory_db
      username: chat_memory_db
      password: xxx

  datasource:
    mysql:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://localhost:3306/fawn_health?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: ${spring.datasource.username}
      password: ${spring.datasource.password}
    postgres:
      url: jdbc:postgresql://xxx/vectorstore
      username: xxx
      password: xxx
      driver-class-name: org.postgresql.Driver

  mail:
    host: smtp.163.com
    protocol: smtps
    port: 587
    username: 15826333626@163.com
    password: VWcJ4DkYeYFcnESy
    nickname: 小鹿健康
    default-encoding: UTF-8
    test-connection: false
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  # Springdoc OpenAPI配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.ljh.fawnhealth.controller

  # Knife4j配置
knife4j:
  enable: true
  setting:
    language: zh_cn

  # OSS配置
ali:
  oss:
    endpoint: ${ali.oss.endpoint}
    access-key-id: ${ali.oss.access-key-id}
    access-key-secret: ${ali.oss.access-key-secret}
    bucket-name: ${ali.oss.bucket-name}


sky:
  jwt:
    # jwt秘钥
    user-secret-key: fawnhealth
    # 过期时间
    user-ttl: 7200000
    # 前端传过来的令牌名称，可以改变和前端商量
    user-token-name: token


load:
  documents:
    on:
      startup: true   # 第一次启动设为 true 加载文档

zhipu:
  api-key: xxx